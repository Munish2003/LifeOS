services:
  api:
    build: .
    container_name: lifeos_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://lifeos_user:lifeos_password@db:5432/lifeos_db
      - SECRET_KEY=lifeos-production-secret-key-change-me
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: lifeos_postgres
    restart: always
    environment:
      - POSTGRES_USER=lifeos_user
      - POSTGRES_PASSWORD=lifeos_password
      - POSTGRES_DB=lifeos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos_user -d lifeos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
